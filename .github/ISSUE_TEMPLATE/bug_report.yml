name: Bug Report
description: Report a bug or issue with Motus
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue. Please fill out the information below.
  
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
      placeholder: What happened?
    validations:
      required: true
  
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run command...
        2. Open application...
        3. See error...
    validations:
      required: true
  
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true
  
  - type: input
    id: version
    attributes:
      label: Version
      description: Which version of Motus are you using?
      placeholder: "1.0.0"
    validations:
      required: true
  
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: Which operating system are you using?
      options:
        - macOS (M1/M2)
        - macOS (Intel)
        - Linux
        - Windows
        - Other
    validations:
      required: true
  
  - type: input
    id: python
    attributes:
      label: Python Version
      description: Which Python version are you using?
      placeholder: "3.12"
    validations:
      required: true
  
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Please paste any relevant error messages or logs.
      render: shell
  
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.

